services:
  # Backend Service - FastAPI
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sequelspeak-backend
    ports:
      - "8000:8000"
    env_file:
      - .env.docker
    environment:
      # Redis connection (for future ConversationState)
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - sequelspeak-network

  # Frontend Service - React + nginx
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Backend API URL (accessible from browser)
        VITE_API_URL: ${VITE_API_URL}
        # Clerk Publishable Key (needed at build time for frontend)
        VITE_CLERK_PUBLISHABLE_KEY: ${CLERK_PUBLISHABLE_KEY}
    container_name: sequelspeak-frontend
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost/",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped
    networks:
      - sequelspeak-network

  # Redis Service - Conversation state management
  redis:
    image: redis:7-alpine
    container_name: sequelspeak-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped
    networks:
      - sequelspeak-network

# Named volumes for persistent data
volumes:
  redis-data:
    driver: local

# Network for inter-service communication
networks:
  sequelspeak-network:
    driver: bridge
