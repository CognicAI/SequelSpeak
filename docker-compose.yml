services:
  # Migration runner — exits after applying all pending Alembic migrations.
  # The backend service waits for this to complete before starting.
  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sequelspeak-migrate
    command: alembic upgrade head
    environment:
      - ENVIRONMENT=${ENVIRONMENT}
      - SECRET_KEY=${SECRET_KEY}
      - CLERK_SECRET_KEY=${CLERK_SECRET_KEY}
      - CLERK_PUBLISHABLE_KEY=${CLERK_PUBLISHABLE_KEY}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS}
      - INTERNAL_DATABASE_URL=postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/sequelspeak
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    networks:
      - sequelspeak-network

  # Backend Service - FastAPI
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sequelspeak-backend
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=${ENVIRONMENT}
      - SECRET_KEY=${SECRET_KEY}
      - CLERK_SECRET_KEY=${CLERK_SECRET_KEY}
      - CLERK_PUBLISHABLE_KEY=${CLERK_PUBLISHABLE_KEY}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS}
      # Redis connection (for future ConversationState)
      - REDIS_URL=redis://redis:6379/0
      - INTERNAL_DATABASE_URL=postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/sequelspeak
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - sequelspeak-network

  # Internal DB - PostgreSQL (for profiles)
  db:
    image: postgres:16-alpine
    container_name: sequelspeak-db
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=sequelspeak
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - sequelspeak-network

  # Frontend Service - React + nginx
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Backend API URL (accessible from browser)
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
        # Clerk Publishable Key (needed at build time for frontend)
        VITE_CLERK_PUBLISHABLE_KEY: ${VITE_CLERK_PUBLISHABLE_KEY}
    container_name: sequelspeak-frontend
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://127.0.0.1/",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped
    networks:
      - sequelspeak-network

  # Redis Service - Conversation state management
  redis:
    image: redis:7-alpine
    container_name: sequelspeak-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped
    networks:
      - sequelspeak-network

# Named volumes for persistent data
volumes:
  redis-data:
    driver: local
  postgres-data:
    driver: local

# Network for inter-service communication
networks:
  sequelspeak-network:
    driver: bridge
