[alembic]
# Path to the migrations directory, relative to this file's location
script_location = alembic

# sqlalchemy.url is intentionally left blank here.
# It is set programmatically in alembic/env.py from config.settings so that
# credentials are never hardcoded in version-controlled files.
sqlalchemy.url =

# Prefix for SQLAlchemy keys in this config section
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
