[pytest]
pythonpath = .
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
asyncio_default_fixture_loop_scope = session
addopts = 
    -v
    --strict-markers
    --tb=short
    --cov=services
    --cov=api
    --cov=utils
    --cov-report=term-missing
    --cov-report=html
    --cov-report=xml
markers =
    unit: Unit tests
    integration: Integration tests with Redis
    slow: Slow running tests

